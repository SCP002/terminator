[package]
name = "terminator"
version = "2.0.0"
edition = "2021"
rust-version = "1.74"
authors = ["SCP002"]
license = "MIT"
description = "Stop processes gracefully, even on Windows, without a kamikaze proxy binary."
repository = "https://github.com/SCP002/terminator"
readme = "README.md"
keywords = ["kill", "signal", "ctrl-c", "sigint", "process"]
categories = ["os", "command-line-utilities"]

[lib]
name = "terminator"
path = "src/lib.rs"

[[bin]]
name = "terminator"
path = "src/bin/cli.rs"

[dependencies]
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
